[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkwash-corpus"
version = "0.1.0"
description = "Real-world measurement corpus for checkwash."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "taipei49314" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
corpus = "corpus.cli:main"

[project.urls]
Homepage = "https://github.com/taipei49314/checkwash-corpus"
Engine = "https://github.com/taipei49314/checkwash"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
