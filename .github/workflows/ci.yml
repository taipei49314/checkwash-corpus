name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: corpus
    env:
      CORPUS_TEST_ENGINE_PYZ: ${{ github.workspace }}/corpus/checkwash.pyz
      CORPUS_TEST_CHECKWASH_ROOT: ${{ github.workspace }}/checkwash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: corpus
          persist-credentials: false
      # The recorded-escape test requires this exact released source beside
      # the corpus checkout. This is a fixture source, not an editable engine.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: taipei49314/checkwash
          ref: 498064f095bd892550a917219798b3f44c42ccef # v0.3.3
          path: checkwash
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install
        id: install
        run: python -m pip install -e ".[dev]"
      - name: verify released engine and source
        id: verify_release
        run: |
          test "$(git -C ../checkwash rev-parse HEAD)" = "498064f095bd892550a917219798b3f44c42ccef"
          curl --fail --location --proto '=https' --proto-redir '=https' --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            --output checkwash.pyz https://github.com/taipei49314/checkwash/releases/download/v0.3.3/checkwash.pyz
          printf '%s  %s\n' '583de5a186662c4f4c550e5d712eb9af7647c7b0af4dbbe21864c8f10f451007' 'checkwash.pyz' | sha256sum --check --strict
      # Engine permits one pin per interpreter. These disjoint invocations
      # cover the entire original suite without relaxing that pin guard.
      - name: test released engine suite
        run: python -m pytest -ra --ignore=tests/test_stress_snapshot.py
      - name: test released snapshot integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.verify_release.outcome == 'success' }}
        run: python -m pytest -ra tests/test_stress_snapshot.py
      - name: validate
        run: python -m corpus validate
      - name: status
        run: python -m corpus status -v
